<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PDF Pro 2.0</title>
<link rel="stylesheet" href="css/styles.css">
<script src="vendor/pdfjs/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "vendor/pdfjs/pdf.worker.min.js";
</script>
<script src="vendor/pdf-lib/pdf-lib.min.js"></script>
</head>
<body>
<main id="appShell">
    <section class="toolbar" id="mainToolbar" aria-label="PDF tools">
        <div class="toolbar-row primary-row">
            <button class="tool-button" id="openBtn" type="button">打开 / Open</button>
            <div class="tool-group" role="group" aria-label="Annotation tools">
                <button class="tool-button mode-button active" type="button" data-mode="text">文字</button>
                <button class="tool-button mode-button" type="button" data-mode="highlight">高亮</button>
                <button class="tool-button mode-button" type="button" data-mode="box">矩形</button>
                <button class="tool-button mode-button" type="button" data-mode="ink">签名</button>
            </div>
            <button class="color-trigger" id="colorBtn" type="button" aria-label="Color"></button>
            <button class="tool-button primary" id="saveBtn" type="button" disabled>保存 / Save</button>
        </div>
        <div class="toolbar-row controls-row">
            <label class="range-field">
                <span>字号 / Size</span>
                <input id="sizeSlider" type="range" min="5" max="60" value="14">
                <output id="sizeValue">14</output>
            </label>
            <label class="range-field">
                <span>透明 / Opacity</span>
                <input id="opacitySlider" type="range" min="0.05" max="1" step="0.05" value="1">
                <output id="opacityValue">100%</output>
            </label>
            <label class="range-field">
                <span>缩放 / Zoom</span>
                <input id="zoomSlider" type="range" min="0.5" max="4" step="0.1" value="1">
                <output id="zoomValue">1.0</output>
            </label>
        </div>
    </section>

    <input id="fileInput" type="file" accept="application/pdf" hidden>

    <button id="emptyState" type="button">
        <span class="empty-icon">PDF</span>
        <span>打开 PDF 文件 / Open a PDF</span>
    </button>

    <div id="scrollWindow">
        <div id="sizingContainer">
            <div id="contentLayer"></div>
        </div>
    </div>

    <div id="customScrollbarTrack" aria-hidden="true"><div id="scrollThumb"></div></div>
    <div class="page-pill" id="pageIndicator">请打开文件 / Open a file</div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <section class="modal-overlay" id="colorModal" aria-label="Color picker">
        <div class="color-panel">
            <div class="color-grid" id="colorGrid"></div>
            <div class="preset-row" id="presetRow"></div>
            <button class="tool-button primary full" id="closeColorBtn" type="button">确定 / Done</button>
        </div>
    </section>
</main>
<script src="js/app.js"></script>
</body>
</html>
